<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Rest Parameter</title>
</head>
<body>
    <script>

        function sum(name, ...data){
            let total = 0;
            for(const item of data){
                total += item;
            }

            document.writeln(`<p>Total ${name} is ${total}</p>`);
        }

        sum("Orange", 2, 4, 5, 7, 3, 11);
        sum("Apple", 21, 14, 75, 17, 30, 1);
        sum("Banana", 12, 9, 58, 71, 93, 10);


    </script>
</body>
</html>
